name: Validate MSCH Nodes
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pytest==8.4.1
      - run: python -m pytest components/a2v/tests -q -x
  security-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 av==15.1.0 librosa==0.11.0 pillow==11.3.0 opencv-python-headless==4.12.0.88 playwright==1.55.0 demucs==4.0.1 aiohttp==3.12.15
      - name: Download pinned official model for compatibility test
        run: curl --fail --location --retry 3 https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th --output "$RUNNER_TEMP/demucs.th"
      - name: Run runtime security tests including symlink escapes
        env:
          MSCH_DEMUCS_CHECKPOINT: ${{ runner.temp }}/demucs.th
        run: python -m unittest discover -s tests -v
